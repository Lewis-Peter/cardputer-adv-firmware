; Cardputer ADV (M5Stack) — 摸鱼时钟固件
; 主控: ESP32-S3FN8 (Stamp-S3A), 8MB Flash, 无 PSRAM
; 屏幕: 1.14" ST7789 240x135
; 板子通过原生 USB-C 连接，所以要打开 USB CDC 才能用串口

[env:cardputer-adv]
; ⚠️ 平台、Arduino core 和下面所有库都钉死在实测过的版本上，原因和升级步骤见
; docs/dependency-pins.md。不钉的话，新机器/服务器上全新构建会解析到别的版本，
; 同一份代码编出来的固件就不一样了（实测 Flash 多 380KB、RAM 多 6KB）。
platform = espressif32@7.0.1
; 平台 7.0.1 对 core 的要求是 ~3.20017.0，同一个 2.0.17 下还会有新的构建号，一并钉住
platform_packages =
	framework-arduinoespressif32@3.20017.241212
board = esp32-s3-devkitc-1
framework = arduino

; --- 板子物理参数 ---
board_build.flash_size = 8MB
board_build.partitions = max_app_8MB.csv
board_upload.flash_size = 8MB

; --- 串口 ---
monitor_speed = 115200

; --- 原生 USB-C 串口 (Cardputer 没有独立 USB 转串口芯片) ---
build_flags =
	-DARDUINO_USB_CDC_ON_BOOT=1
	-DARDUINO_USB_MODE=1
	-Wno-cpp                       ; 静音 RadioLib 里那条无害的 "USB CDC debug" #warning

; --- 只对 src/ 开警告 ---
; 用 build_src_flags 而不是 build_flags：后者会连第三方库一起编，M5GFX/RadioLib 那边
; 的警告会把输出淹掉，自己代码的问题反而看不见。
; 这套开起来当场抓到过真问题：LoRa 抓包日志那行的缓冲区只有 40 字节，而 Meshtastic
; 帧头那行最长 39 字符——再多一位 RSSI 就被截掉了。
build_src_flags =
	-Wall
	-Wextra
	-Wno-unused-parameter          ; 回调签名固定，用不到的形参很正常
	-Wno-missing-field-initializers ; 结构体只初始化前几个字段是这个项目的常用写法

; --- 根证书 bundle ---
; 121 张 Mozilla 根证书，编进 flash（约 56KB）。有了它就能对任意公网 HTTPS 做**真校验**，
; 不用给每个域名手贴一份根证书、也不用退回 setInsecure()。
; ⚠️ RAM 开销很小：只有索引常驻，证书本体留在 flash 里按需读。
; 重新生成（换新根证书 / 想换证书来源时）：见 tools/README.md 的 "根证书 bundle" 一节。
board_build.embed_files = data/cert/x509_crt_bundle.bin

; --- 依赖库：全部精确版本（为什么、怎么升级见 docs/dependency-pins.md）---
lib_deps =
	; M5Unified 0.2.23 起强制要求 M5GFX 0.2.30，而 M5GFX 0.2.28 起把屏幕 SPI 从实际 80MHz
	; 修正到 40MHz，整屏刷新慢一倍。两个要升就一起升，并上机测刷新和频谱页麦克风。
	m5stack/M5Unified@0.2.20
	; M5Unified 只声明了版本范围，不单独钉的话它会自己拉更新的 M5GFX
	m5stack/M5GFX@0.2.27
	mikalhart/TinyGPSPlus@1.1.0
	bblanchon/ArduinoJson@7.4.3
	jgromes/RadioLib@7.7.1
	; 3.10.5 在这套 IDF4 core 上把 iostream/locale 整套链进来（Flash +375KB、RAM +6KB），
	; 驱动 SK6812 也从 RMT 退回 CPU 阻塞翻转。没有 iostream 依赖的版本出来之前别升。
	fastled/FastLED@3.10.3
	; 网络收音机的 MP3 解码。PlatformIO 注册表里没有这个包，只能走 GitHub 直链；
	; 必须钉在 1.9.9——master 的 I2S 输出类改用了 IDF5 的 driver/i2s_std.h，
	; 本工程的 Arduino core 还是 IDF4，会编不过（我们只用它的解码器，输出是自己的 RadioOut）。
	https://github.com/earlephilhower/ESP8266Audio.git#1.9.9
	ewpa/LibSSH-ESP32@5.9.0

